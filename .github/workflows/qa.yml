name: FRAME Feature QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Verify live One Piece arc artwork API
        if: github.event_name != 'pull_request'
        run: node scripts/test-one-piece-arc-art.mjs
      - name: Build FRAME for isolated browser tests
        env:
          VITE_FRAME_E2E: 'true'
        run: npm run build
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run browser smoke tests
        run: npx playwright test --project=chromium --max-failures=1
