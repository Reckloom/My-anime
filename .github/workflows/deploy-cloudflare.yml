name: Deploy FRAME to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL || 'https://blwnhfhpckqbetwxamqr.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_g3pzBUEsZtPQ1sGJjrDxHw_ldR3dO49' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build FRAME
        run: npm run build

      - name: Normalize Cloudflare account ID
        shell: bash
        run: |
          account_id="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n' | sed "s/^[[:space:]\"']*//;s/[[:space:]\"']*$//")"
          if [[ ! "$account_id" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be the raw Cloudflare account ID, without quotes or extra text."
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Validate deployment configuration
        run: |
          missing=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required GitHub Actions secret/variable: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::FRAME was not deployed. Configure the Cloudflare repository Actions secrets and rerun this workflow."
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc
